<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring Boot 原型</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="card">
        <p class="eyebrow">Prototype</p>
        <h1>Spring Boot 网页已上线</h1>
        <p class="lead">这台机器之前用于小龙虾相关服务，闲置了一段时间。现在跑着一个可访问的 Spring Boot 原型，方便继续往上加功能。</p>
        <dl class="meta">
            <div>
                <dt>服务状态</dt>
                <dd id="status">检测中…</dd>
            </div>
            <div>
                <dt>服务器时间</dt>
                <dd th:text="${serverTime} + ' ' + ${zoneLabel}">—</dd>
            </div>
            <div>
                <dt>数据库</dt>
                <dd id="db-status">检测中…</dd>
            </div>
            <div>
                <dt>接口</dt>
                <dd><a href="/api/health">/api/health</a> · <a href="/api/info">/api/info</a> · <a href="/api/db">/api/db</a></dd>
            </div>
        </dl>
        <section class="arcade" id="games">
            <div class="arcade-head">
                <h2>小游戏</h2>
                <a href="/games">进入游戏厅</a>
            </div>
            <p class="arcade-note">三款纯前端小游戏，打开就能玩，分数不提交到服务器。</p>
            <div class="arcade-links">
                <a href="/games/snake">
                    <strong>贪吃蛇</strong>
                    <span>方向键或滑动</span>
                </a>
                <a href="/games/2048">
                    <strong>2048</strong>
                    <span>合并相同数字</span>
                </a>
                <a href="/games/breakout">
                    <strong>打砖块</strong>
                    <span>接住小球</span>
                </a>
            </div>
        </section>
    </main>
    <script>
        fetch("/api/health")
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var el = document.getElementById("status");
                el.textContent = data.status === "ok" ? "运行正常" : "异常";
                el.className = data.status === "ok" ? "ok" : "bad";
            })
            .catch(function () {
                var el = document.getElementById("status");
                el.textContent = "无法连接接口";
                el.className = "bad";
            });
        fetch("/api/db")
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var el = document.getElementById("db-status");
                el.textContent = data.status === "ok" ? "已连接" : "连接异常";
                el.className = data.status === "ok" ? "ok" : "bad";
            })
            .catch(function () {
                var el = document.getElementById("db-status");
                el.textContent = "无法连接接口";
                el.className = "bad";
            });
    </script>
</body>
</html>
