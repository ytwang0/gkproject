<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2048 · 游戏厅</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/games.css">
</head>
<body class="play">
    <main class="card">
        <nav class="crumbs" aria-label="位置">
            <a href="/">首页</a>
            <span aria-hidden="true">/</span>
            <a href="/games">游戏厅</a>
        </nav>
        <p class="eyebrow">小游戏</p>
        <h1>2048</h1>
        <p class="lead">用方向键、WASD，或在棋盘上滑动。相同的两个数字相撞会合成一个，目标是 2048。最高分只保存在这台浏览器里。</p>
        <div class="hud">
            <div class="stat">
                <span>得分</span>
                <strong id="score" aria-live="polite">0</strong>
            </div>
            <div class="stat">
                <span>最高</span>
                <strong id="best">0</strong>
            </div>
            <button type="button" class="btn" id="restart">新游戏</button>
        </div>
        <div class="board-wrap" id="board">
            <div id="grid" class="grid" role="application" aria-label="2048 棋盘"></div>
            <div class="overlay" id="overlay">
                <h2 id="overlay-title">2048</h2>
                <p id="overlay-text">按「开始」，或直接按方向键。</p>
                <div class="overlay-actions">
                    <button type="button" class="btn" id="overlay-primary">开始</button>
                    <button type="button" class="btn secondary" id="overlay-secondary" hidden>再来一局</button>
                </div>
            </div>
        </div>
        <div class="pad" id="pad" aria-label="方向控制">
            <button type="button" data-x="0" data-y="-1" aria-label="向上">上</button>
            <button type="button" data-x="-1" data-y="0" aria-label="向左">左</button>
            <button type="button" data-x="0" data-y="1" aria-label="向下">下</button>
            <button type="button" data-x="1" data-y="0" aria-label="向右">右</button>
        </div>
        <noscript><p class="message">需要开启 JavaScript 才能玩游戏。</p></noscript>
    </main>
    <script src="/games/2048.js"></script>
</body>
</html>
