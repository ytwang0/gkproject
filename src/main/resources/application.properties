server.port=8081
spring.application.name=web-prototype

# Password is required from the environment. Do not default it or commit it.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/gkproject?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:gkproject}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=gkproject
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000
# Bound a dead server so /api/db fails instead of hanging. Values are milliseconds.
spring.datasource.hikari.data-source-properties.connectTimeout=5000
spring.datasource.hikari.data-source-properties.socketTimeout=5000
